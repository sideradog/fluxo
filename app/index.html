<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo - demonstração</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1F4D;--navy2:#1A3470;--mid:#123A7E;--blue:#2456E6;--bg:#F3F5FA;--card:#fff;--line:#DDE3EF;--line2:#C5CEE0;--muted:#55627F;--tint:#E6ECFB;--ok:#0F6B43;--bad:#A32020}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--navy);background:#DCE2EE}
button,input{font-family:inherit}
button{cursor:pointer}
h1,h2,.sora{font-family:Sora,sans-serif}
#app{max-width:430px;min-height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
.demo{background:#FFE9B8;color:#4A3500;font-size:12px;font-weight:600;text-align:center;padding:6px 10px}
.top{background:var(--navy);color:#fff;border-radius:0 0 28px 28px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.brand{font-family:Sora,sans-serif;font-weight:800;font-size:24px;letter-spacing:1px}
.pill{height:44px;padding:0 16px;border-radius:22px;border:0;background:#fff;color:var(--navy);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.pill.ghost{background:var(--navy2);color:#fff}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy)}
.round.dark{background:var(--navy2);border:0;color:#fff}
.round.solid{background:var(--navy);border:0;color:#fff}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.top .eyebrow{color:#C9D6F5}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--navy2)}
.search input{flex:1;min-width:0;height:44px;border:0;background:transparent;color:#fff;font-size:15px;outline:none}
.search input::placeholder{color:#C9D6F5}
.chips{display:flex;gap:8px;padding:16px 20px 4px;overflow-x:auto}
.chip{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line2);background:#fff;color:var(--navy);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.body{padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.prod{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line);width:100%;text-align:left;color:inherit}
.tile{width:60px;height:60px;border-radius:14px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mid)}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:15px}
.sub{font-size:13px;color:var(--muted);line-height:1.45}
.price{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--blue)}
.cta{height:60px;border-radius:20px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;width:100%}
.cta.center{justify-content:center}
.cta.navy{background:var(--navy)}
.cta.line{background:transparent;border:2px solid var(--navy);color:var(--navy)}
.cta:disabled{background:#8A93A8;cursor:not-allowed}
.foot{position:sticky;bottom:0;padding:12px 16px 18px;background:linear-gradient(to top,var(--bg) 75%,transparent)}
.box{border-radius:18px;background:#fff;border:1px solid var(--line);padding:16px}
.hr{height:1px;background:var(--line);margin:10px 0}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--tint);font-size:13px;line-height:1.45;color:#40507A}
.note b{display:block;color:var(--navy);font-size:14px}
.head{padding:22px 20px 4px;display:flex;align-items:center;gap:12px}
.head h1{margin:0;font-size:22px}
.hero{background:var(--tint);height:260px;border-radius:0 0 28px 28px;padding:22px 20px;display:flex;flex-direction:column;color:var(--mid)}
.step{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:#fff;font-size:22px;font-weight:700;color:var(--navy)}
.step.add{background:var(--navy);color:#fff;border:0}
.pay{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:#fff;border:2px solid var(--line);min-height:44px}
.pay.on{border-color:var(--blue)}
.pay input{width:22px;height:22px;accent-color:var(--blue)}
.seg{display:flex;gap:6px;padding:4px;border-radius:16px;background:var(--navy2)}
.seg button{flex:1;height:44px;border-radius:12px;border:0;background:transparent;color:#fff;font-weight:600;font-size:14px}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.ticket{display:flex;align-items:stretch;border-radius:18px;background:#fff;border:1px solid var(--line);overflow:hidden;min-height:92px;width:100%;padding:0;text-align:left;color:inherit}
.stub{width:72px;background:var(--mid);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.stub.used{background:#6B7690}
.dash{border-left:2px dashed var(--line2)}
.okc{color:var(--ok);font-weight:700;font-size:13px}
.usedc{color:var(--muted);font-weight:700;font-size:13px}
.dark{background:var(--navy);color:#fff}
.dark .sub{color:#C9D6F5}
.qr{background:#fff;border-radius:26px;color:var(--navy);display:flex;flex-direction:column;align-items:center;padding:22px;gap:14px}
.code{font-family:Sora,sans-serif;font-weight:700;font-size:18px;letter-spacing:2px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:100%}
.bar i{display:block;height:6px;background:var(--blue);border-radius:3px}
.field{height:56px;border-radius:14px;border:2px solid var(--line2);padding:0 14px;font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;width:100%;color:var(--navy);background:#fff}
.result{border-radius:22px;padding:24px 20px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.result.ok{background:var(--ok)}.result.bad{background:var(--bad)}
.result h2{margin:0;font-size:26px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}
.spin{width:22px;height:22px;border:3px solid var(--line2);border-top-color:var(--mid);border-radius:50%;animation:s 1s linear infinite;flex-shrink:0}
.evcard{position:relative;height:214px;border-radius:26px;overflow:hidden;box-shadow:0 10px 24px rgba(10,31,77,.18)}
.evbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.evbig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:96px;letter-spacing:4px;opacity:.9;padding-bottom:36px}
.evscrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,12,30,.92) 0%,rgba(5,12,30,.55) 38%,rgba(5,12,30,0) 70%)}
.evhit{position:absolute;inset:0;background:none;border:0;z-index:1}
.evhit:focus-visible{outline:3px solid #FFB020;outline-offset:-3px}
.evinfo{position:absolute;left:18px;right:18px;bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none;z-index:2}
.evdate{display:inline-flex;align-items:center;gap:6px;background:rgba(5,12,30,.72);color:#fff;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700}
.evname{color:#fff;font-weight:800;font-size:22px;line-height:1.15}
.evbadge{position:absolute;right:14px;top:14px;z-index:2;display:inline-flex;align-items:center;gap:7px;background:rgba(5,12,30,.72);color:#fff;border-radius:16px;padding:7px 12px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;pointer-events:none}
.evbadge i{width:9px;height:9px;border-radius:50%;background:#2EE08A}
.evbtn{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;border:0;background:#fff;color:var(--navy);font-weight:700;font-size:13px}
.evpage{flex:1;display:flex;flex-direction:column;background:var(--navy);color:#fff}
.evhero{position:relative;height:250px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.evhero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.evhero>span.sora{font-weight:800;font-size:110px;letter-spacing:4px}
.evhero>i{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to top,#0A1F4D 4%,rgba(10,31,77,0))}
.evbody{padding:0 20px 20px;display:flex;flex-direction:column;gap:18px;margin-top:-34px;position:relative;flex:1}
.evhero.hasimg{height:auto;display:block}
.evhero.hasimg>img{position:static;height:auto;display:block}
.evbody.flat{margin-top:18px}
.evbody h1{margin:0;font-size:34px;line-height:1.05;font-weight:800}
.evfacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.evfacts>div{background:#132B63;border:1px solid #2A4384;border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;min-width:0}
.evfacts span{width:40px;height:40px;border-radius:12px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.evfacts b{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#C9D6F5}
.evsec{display:flex;flex-direction:column;gap:10px}
.evsec h2{margin:0;font-size:18px}
.evsec p{margin:0;color:#E4EBFB;font-size:16px;line-height:1.5}
.evrules{display:flex;flex-direction:column;gap:8px}
.evrules>div{display:flex;align-items:center;gap:14px;background:#132B63;border:1px solid #2A4384;border-radius:16px;padding:12px 14px;font-size:15px;color:#E4EBFB}
.evrules i{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.35)}
.evrules b{display:block;color:#fff;font-size:16px}
.evhow>div{display:flex;align-items:center;gap:12px;color:#E4EBFB;font-size:15px}
.evhow span{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--navy);font-family:Sora,sans-serif;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.evtix{display:flex;align-items:center;gap:12px;background:#132B63;border:1px solid #2A4384;border-radius:18px;padding:16px}
.evtix b{display:block;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#C9D6F5}
.evtix .sora{font-weight:800;font-size:22px}
.evorg{display:flex;align-items:center;gap:14px;background:#132B63;border:1px solid #2A4384;border-radius:18px;padding:14px}
.evorg>span{width:48px;height:48px;border-radius:50%;background:#FFD23F;color:#0A1F4D;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.evorg small{display:block;color:#C9D6F5;font-size:12px}
.evorg b{font-size:17px}
.evlink{display:flex;align-items:center;gap:12px;min-height:56px;background:#132B63;border:1px solid #2A4384;border-radius:16px;padding:10px 14px;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.evlink>svg:last-child{margin-left:auto;flex-shrink:0}
.evadmin{border:2px dashed #FFD23F;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.evfoot{background:linear-gradient(to top,#0A1F4D 75%,rgba(10,31,77,0))}
.evrow{display:flex;align-items:center;gap:16px;padding:14px 0;background:none;border:0;width:100%;text-align:left;color:inherit}
.evthumb{width:84px;height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;letter-spacing:1px;flex-shrink:0;border:1px solid var(--line)}
.evchip{background:var(--tint);color:var(--navy);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.shade{position:fixed;inset:0;background:rgba(10,31,77,.55);z-index:30}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:18px 14px 22px;z-index:31;display:flex;flex-direction:column;gap:2px;max-height:85%;overflow:auto}
.login{flex:1;background:#FEFEFE;display:flex;flex-direction:column;padding:8px 24px 28px;gap:18px}
.login img{width:230px;max-width:70%;height:auto;align-self:center;display:block}
.login h1{margin:0;font-size:22px;text-align:center}
.login form{display:flex;flex-direction:column;gap:14px}
.lbl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.inp{height:54px;border-radius:14px;border:2px solid var(--line2);padding:0 14px;font-size:16px;color:var(--navy);background:#fff;width:100%}
.inp:focus{outline:none;border-color:var(--blue)}
.err{background:#FBE9E9;color:#8A1C1C;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;font-size:15px;min-height:44px;padding:0 6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

var h='<div class="top" style="background:var(--navy)"><div class="row between"><div class="brand" style="font-size:20px">FLUXO <span style="font-weight:600;letter-spacing:0">Balcão</span></div><button class="pill" data-a="eventos">Sair do modo balcão</button></div>';
if(!ids.length){
h+='<div class="sub" style="color:#C9D6F5">Área da equipe. Só entra quem foi autorizado pelo administrador do evento.</div></div><div class="body" style="padding-top:20px">'
+'<div class="box" style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">Seu ID de usuário</div><div class="code" style="font-size:24px;letter-spacing:3px">'+meuId()+'</div><div class="sub">Passe este ID para o administrador. O botão copia o ID junto com o seu nome. Ele devolve um código de acesso.</div><button class="cta center line" style="height:50px" data-a="copiar" data-v="'+esc(meuId()+' | '+(S.user?S.user.nome:''))+'">Copiar meu ID</button></div>'
+'<form id="acform" novalidate style="display:flex;flex-direction:column;gap:12px"><label class="lbl">Código de acesso<input class="field" id="ac-cod" type="text" autocomplete="off" maxlength="12" placeholder="XXXXXXXX"></label>'+(S.aviso?'<div class="err" role="alert">'+esc(S.aviso)+'</div>':'')+'<button class="cta center" type="submit">Liberar meu acesso</button></form></div>';
return h;}
if(!S.bev||ids.indexOf(S.bev)<0)S.bev=ids.indexOf(S.evento)>=0?S.evento:ids[0];
h+='<div><div class="eyebrow">Validando fichas de</div><div class="sora" style="font-weight:700;font-size:20px;margin-top:4px">'+esc(ev(S.bev).nome)+'</div></div>';
if(ids.length>1){h+='<div class="chips" style="padding:0">'+ids.map(function(i){return '<button class="chip'+(i===S.bev?' on':'')+'" style="'+(i===S.bev?'background:#fff;color:var(--navy);border-color:#fff':'background:var(--navy2);color:#fff;border-color:var(--navy2)')+'" data-a="bev" data-v="'+i+'">'+esc(ev(i).nome)+'</button>';}).join('')+'</div>';}
h+='<div class="sub" style="color:#C9D6F5">No app real a leitura é pela câmera. Aqui você digita o código da ficha.</div></div><div class="body" style="padding-top:20px">';
if(S.leitura){
var L=S.leitura,T={usada:'Ficha já usada',outro:'Ficha de outro evento',inexistente:'Ficha não encontrada'};
if(L.ok)h+='<div class="result ok" role="status"><div class="round" style="width:84px;height:84px;border-radius:42px;border:0;color:var(--ok)">'+ic('check',44,3)+'</div><h2>Ficha válida</h2><div>'+(prod(L.prod).ing?'Libere a entrada: ':'Entregue: ')+'<b>1x '+esc(prod(L.prod).nome)+'</b></div><div style="font-size:13px">'+L.codigo+' · baixa registrada</div></div>';
else h+='<div class="result bad" role="alert"><div class="round" style="width:84px;height:84px;border-radius:42px;border:0;color:var(--bad)">'+ic('x',44,3)+'</div><h2>'+T[L.motivo]+'</h2><div>'+(L.motivo==='outro'?'Esta ficha vale em '+esc(ev(L.ev).nome)+'.':'Não entregue o pedido.')+'</div><div style="font-size:13px">'+esc(L.codigo)+'</div></div>';
h+='<button class="cta center navy" data-a="proxima">'+ic('scan',22)+'&nbsp; Ler próxima ficha</button>';
}else{
h+='<label class="name" for="cod">Código da ficha</label><input id="cod" class="field" type="text" autocomplete="off" placeholder="FLX-0000-0000" value="'+esc(S.codigo)+'"><button class="cta center" data-a="validar">Validar ficha</button>';
var d=S.fichas.filter(function(f){return !f.usada;});
if(d.length){h+='<div class="eyebrow" style="margin-top:10px">Fichas disponíveis neste aparelho (atalho de teste)</div>';d.forEach(function(f){h+='<button class="prod" data-a="validar-cod" data-v="'+f.codigo+'"><span class="grow"><span class="name" style="display:block">'+esc(prod(f.prod).nome)+'</span><span class="sub">'+f.codigo+' · '+esc(ev(f.ev).nome)+'</span></span><span class="round solid">'+ic('scan',20)+'</span></button>';});}
}
if(isAdmin())h+='<button class="pill" style="align-self:center;border:1px solid var(--line2);margin-top:14px" data-a="reset">'+ic('trash',18)+'Apagar dados de teste</button>';
return h+'</div>';
}

function validar(cod){
cod=String(cod||'').trim().toUpperCase();if(!cod)return;
if(!podeBalcao(S.bev))return go('balcao');
var f=S.fichas.filter(function(x){return x.codigo===cod;})[0];
if(!f)S.leitura={ok:false,motivo:'inexistente',codigo:cod};
else if((f.ev||'e1')!==S.bev)S.leitura={ok:false,motivo:'outro',codigo:cod,ev:f.ev||'e1'};
else if(f.usada)S.leitura={ok:false,motivo:'usada',codigo:cod};
else{f.usada=true;save();S.leitura={ok:true,codigo:cod,prod:f.prod};}
S.codigo='';render();
}

function render(){
if(!S.user)S.view='login';
var v={login:vLogin,evento:vEvento,evedit:vEvEdit,eventos:vEventos,perfil:vPerfil,menu:vMenu,item:vItem,pedido:vPedido,pix:vPix,fichas:vFichas,ficha:vFicha,balcao:vBalcao,equipe:vEquipe}[S.view]();
app.innerHTML='<div class="demo">Versão de demonstração · pagamento simulado · dados salvos só neste aparelho</div>'+v+(S.sheet&&S.user?vSheet():'');
if(S.view==='ficha'&&document.getElementById('qrbox')){tickQr();if(!timer)timer=setInterval(tickQr,500);}
}

app.addEventListener('click',function(e){
var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
S.sheet=false;
if(a==='sheet'){S.sheet=true;render();}
else if(a==='voltar')go(S.volta||'eventos');
else if(a==='fechar'){render();}
else if(a==='eventos')go('eventos');
else if(a==='perfil')go('perfil');
else if(a==='evento'){S.evento=v;save();go('menu');}
else if(a==='ingresso'){var ki='ing-'+v;S.cart[ki]=(S.cart[ki]||0)+1;save();go('pedido');}
else if(a==='foto-rem'){if(S.user){delete S.user.foto;save();}render();}
else if(a==='ev-abrir')go('evento',{evSel:v,draft:null});
else if(a==='ev-editar'){if(isAdmin())go('evedit',{evSel:v,draft:null});}
else if(a==='ev-reset'){if(isAdmin()){delete S.evEdits[v];save();go('evento',{evSel:v,draft:null});}}
else if(a==='auth'){S.auth=v;S.erro='';render();}
else if(a==='sair'){save();S.user=null;S.cart={};S.fichas=[];S.auth='entrar';save();go('login');}
else if(a==='menu')go('menu',{leitura:null});
else if(a==='fichas')go('fichas');
else if(a==='cat'){S.cat=v;render();}
else if(a==='item')go('item',{item:v,qtd:1});
else if(a==='menos'){if(S.qtd>1){S.qtd--;render();}}
else if(a==='mais'){if(S.qtd<20){S.qtd++;render();}}
else if(a==='add'){S.cart[S.item]=(S.cart[S.item]||0)+S.qtd;save();go('menu');}
else if(a==='pedido')go('pedido');
else if(a==='rem'){delete S.cart[v];save();render();}
else if(a==='pagar')go('pix');
else if(a==='aprovar'){for(var k in S.cart)for(var i=0;i<S.cart[k];i++)S.fichas.unshift({codigo:novoCodigo(),prod:k,usada:false,ev:prod(k).ing?prod(k).ev:S.evento});S.cart={};save();go('fichas',{aba:'disp'});}
else if(a==='aba'){S.aba=v;render();}
else if(a==='abrir')go('ficha',{ficha:v});
else if(a==='balcao')go('balcao',{leitura:null,codigo:'',aviso:''});
else if(a==='bev'){S.bev=v;S.leitura=null;render();}
else if(a==='equipe'){if(isAdmin())go('equipe',{evSel:v,ultCod:null,aviso:''});}
else if(a==='eq-rem'){if(isAdmin()){var id0=ev(S.evSel).id;S.equipe[id0]=eqLista(id0).filter(function(u){return u.id!==v;});S.ultCod=null;save();render();}}
else if(a==='copiar'){var bt=b;try{navigator.clipboard.writeText(v).then(function(){bt.textContent='Copiado';},function(){bt.textContent='Copie manualmente: '+v;});}catch(x){bt.textContent='Copie manualmente: '+v;}}
else if(a==='balcao-com'){var fx=S.fichas.filter(function(x){return x.codigo===v;})[0];go('balcao',{leitura:null,codigo:'',bev:fx?(fx.ev||'e1'):S.evento});validar(v);}
else if(a==='validar'){var c=document.getElementById('cod');validar(c?c.value:'');}
else if(a==='validar-cod')validar(v);
else if(a==='proxima'){S.leitura=null;render();}
else if(a==='reset'){S.cart={};S.fichas=[];S.leitura=null;save();render();}
});
app.addEventListener('input',function(e){
if(e.target.id==='busca'){S.busca=e.target.value;var pos=e.target.selectionStart;render();var n=document.getElementById('busca');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}}
else if(e.target.id==='cod'){S.codigo=e.target.value;}
else if(e.target.id==='buscaev'){S.buscaEv=e.target.value;var p2=e.target.selectionStart;render();var n2=document.getElementById('buscaev');if(n2){n2.focus();try{n2.setSelectionRange(p2,p2);}catch(x){}}}
else if(e.target.id==='f-cpf'){e.target.value=maskCpf(e.target.value);}
else if(e.target.id==='f-cel'){e.target.value=maskCel(e.target.value);}
});
app.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='authform')autenticar();else if(e.target.id==='evform')salvarEvento();else if(e.target.id==='eqform')autorizar();else if(e.target.id==='acform')liberar();});
app.addEventListener('change',function(e){if(e.target.name==='pag'){S.pag=e.target.value;render();}else if(e.target.id==='ee-banner'){lerBanner(e.target.files&&e.target.files[0]);}else if(e.target.id==='pf-foto'){lerFoto(e.target.files&&e.target.files[0]);}});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cod'){validar(e.target.value);}});
render();
})();
</script>
</body>
</html>
